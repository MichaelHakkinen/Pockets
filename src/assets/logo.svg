<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="neonPocket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Coins jumping into pocket -->
  <circle cx="210" cy="150" r="32" fill="url(#coinGrad)" opacity="0.9" filter="url(#glow)"/>
  <text x="210" y="160" font-family="system-ui, sans-serif" font-weight="900" font-size="28" fill="#78350f" text-anchor="middle">$</text>
  
  <circle cx="310" cy="170" r="24" fill="url(#neonPocket)" opacity="0.8" filter="url(#glow)"/>
  <text x="310" y="179" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#090d16" text-anchor="middle">€</text>

  <!-- Pocket Outer Shape -->
  <g filter="url(#glow)">
    <path d="M 120 200 L 392 200 Q 402 200 402 210 L 402 360 Q 402 430 332 430 L 180 430 Q 110 430 110 360 L 110 210 Q 110 200 120 200 Z" 
          fill="none" stroke="url(#neonPocket)" stroke-width="20" stroke-linejoin="round" />
    
    <!-- Pocket curved inner stitch/crease -->
    <path d="M 112 250 Q 256 310 400 250" 
          fill="none" stroke="url(#neonPocket)" stroke-width="12" stroke-linecap="round" opacity="0.75" />
          
    <path d="M 120 300 Q 256 370 392 300" 
          fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" opacity="0.4" />
  </g>
</svg>